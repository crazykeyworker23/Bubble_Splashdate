# flutter_native_splash configuration file
# See: https://pub.dev/packages/flutter_native_splash

flutter_native_splash:
  # Splash simple: fondo sólido + logo centrado
  fullscreen: true
  android: false
  ios: false
  web: false

  color: "#1B6F81"
  color_dark: "#1B6F81"

  image: assets/logob.png
  image_dark: assets/logob.png

  android_gravity: center
  ios_content_mode: center

  # Android 12+ usa color + icono
  android_12:
    color: "#1B6F81"
    icon_background_color: "#1B6F81"
    image: assets/logob.png
